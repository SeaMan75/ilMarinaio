<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>2048 3D — Gold Edition</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #3a2a1a; font-family: 'Segoe UI', sans-serif; color: #ffe8b0;
    /* Запрет выделения и выделения при долгом нажатии */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }
  #ui {
    position: absolute; top: env(safe-area-inset-top, 15px); left: 15px; z-index: 10;
    background: rgba(60,40,20,0.85); padding: 14px 18px; border-radius: 12px;
    border: 2px solid rgba(255,215,0,0.4); backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(255,215,0,0.25);
  }
  #ui h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: 3px;
    background: linear-gradient(90deg,#ffd700,#ffed4e,#ffd700);
    -webkit-background-clip: text; color: transparent; }
  #score { font-size: 15px; margin: 3px 0; }
  #best { font-size: 13px; opacity: 0.9; }
  #hint { font-size: 11px; opacity: 0.7; margin-top: 6px; }
  /* На десктопе показываем стрелки, на мобильном — свайп */
  #hint .mobile { display: none; }
  @media (hover: none) and (pointer: coarse) {
    #hint .desktop { display: none; }
    #hint .mobile { display: inline; }
  }
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 42px; margin: 0; color: #ffd700; text-shadow: 0 0 40px #ffd700; }
  #overlay p { font-size: 18px; margin: 10px 0; }
  #overlay button {
    margin-top: 20px; padding: 14px 35px; font-size: 18px; cursor: pointer;
    background: linear-gradient(135deg,#ffd700,#ffed4e); color: #1a1410;
    border: none; border-radius: 8px; letter-spacing: 2px; font-weight: bold;
    box-shadow: 0 0 20px rgba(255,215,0,0.5);
  }
  #overlay button:hover { transform: scale(1.05); }

  /* Стрелка-индикатор свайпа */
  #swipeIndicator {
    position: absolute; top: 50%; left: 50%;
    width: 120px; height: 120px;
    margin: -60px 0 0 -60px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 15;
  }
  #swipeIndicator.show { opacity: 0.9; }
  #swipeIndicator svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 15px rgba(255,215,0,0.8));
  }
  #swipeIndicator path {
    fill: none;
    stroke: #ffd700;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
<div id="ui">
  <h1>2048 · GOLD</h1>
  <div id="score">Счёт: 0</div>
  <div id="best">Рекорд: 0</div>
  <div id="hint">
    <span class="desktop">← ↑ → ↓</span>
    <span class="mobile">👆 Свайпай</span>
  </div>
</div>

<div id="swipeIndicator">
  <svg viewBox="0 0 100 100"><path id="swipeArrow" d=""/></svg>
</div>

<div id="overlay">
  <h2 id="endText">GAME OVER</h2>
  <p id="finalScore"></p>
  <button onclick="game.restart()">НОВАЯ ИГРА</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SIZE = 4;
const TILE = 1.0;
const GAP  = 0.12;
const STEP = TILE + GAP;

// ---------- Звуки + вибрация ----------
class SoundManager {
  constructor() { this.ctx = null; this.enabled = true; }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Возобновляем контекст после жеста пользователя (требование iOS)
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }
  playMove() {
    if (!this.enabled || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.frequency.value = 220;
    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
    osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    this.vibrate(15);
  }
  playMerge(value) {
    if (!this.enabled || !this.ctx) return;
    const freq = 300 + Math.log2(value) * 60;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
    const osc2 = this.ctx.createOscillator();
    const gain2 = this.ctx.createGain();
    osc2.connect(gain2); gain2.connect(this.ctx.destination);
    osc2.frequency.value = freq * 2.5;
    osc2.type = 'triangle';
    gain2.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
    osc2.start(); osc2.stop(this.ctx.currentTime + 0.5);
    this.vibrate([20, 30, 40]);
  }
  playSpawn() {
    if (!this.enabled || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.frequency.value = 180;
    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
    osc.start(); osc.stop(this.ctx.currentTime + 0.15);
  }
}
const sound = new SoundManager();

// ---------- Золотая текстура ----------
function makeGoldTexture(value) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const palettes = {
    2:    ['#f5e6a8', '#d4b878', '#a8884a'],
    4:    ['#f0d890', '#c8a860', '#9c7838'],
    8:    ['#f0c870', '#c89040', '#8c6020'],
    16:   ['#e8b858', '#b87828', '#7c4810'],
    32:   ['#e0a848', '#a86818', '#6c3808'],
    64:   ['#d89838', '#985808', '#5c2800'],
    128:  ['#d08828', '#884808', '#4c1800'],
    256:  ['#c87818', '#783808', '#3c0800'],
    512:  ['#c06808', '#682808', '#2c0000'],
    1024: ['#b85808', '#581808', '#1c0000'],
    2048: ['#ffcc00', '#cc6600', '#660000'],
  };
  const [c1, c2, c3] = palettes[value] || palettes[2048];
  const grad = ctx.createRadialGradient(size/2, size/2, 30, size/2, size/2, size/1.1);
  grad.addColorStop(0, c1); grad.addColorStop(0.6, c2); grad.addColorStop(1, c3);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 80; i++) {
    const y = Math.random() * size;
    ctx.strokeStyle = `rgba(255,255,240,${Math.random() * 0.15})`;
    ctx.lineWidth = Math.random() * 1.5;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y + (Math.random() - 0.5) * 20);
    ctx.stroke();
  }
  for (let i = 0; i < 40; i++) {
    const y = Math.random() * size;
    ctx.strokeStyle = `rgba(40,20,0,${Math.random() * 0.2})`;
    ctx.lineWidth = Math.random() * 1.2;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y + (Math.random() - 0.5) * 30);
    ctx.stroke();
  }
  const shine = ctx.createRadialGradient(size*0.3, size*0.3, 0, size*0.3, size*0.3, size*0.5);
  shine.addColorStop(0, 'rgba(255,255,220,0.4)');
  shine.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = shine;
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 600; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.05})`;
    ctx.fillRect(Math.random()*size, Math.random()*size, 1, 1);
  }
  for (let i = 0; i < 300; i++) {
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.08})`;
    ctx.fillRect(Math.random()*size, Math.random()*size, 1, 1);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontSize = value >= 1000 ? 150 : value >= 100 ? 180 : 230;
  ctx.font = `900 ${fontSize}px "Segoe UI", Arial`;
  ctx.fillStyle = 'rgba(20,10,0,0.85)';
  ctx.fillText(value, size/2 + 5, size/2 + 7);
  ctx.fillStyle = 'rgba(255,240,180,0.5)';
  ctx.fillText(value, size/2 - 2, size/2 - 3);
  ctx.fillStyle = 'rgba(30,15,0,0.7)';
  ctx.fillText(value, size/2, size/2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 8;
  return tex;
}

function makeBumpTexture(value) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, size, size);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontSize = value >= 1000 ? 150 : value >= 100 ? 180 : 230;
  ctx.font = `900 ${fontSize}px "Segoe UI", Arial`;
  ctx.fillStyle = '#000';
  ctx.fillText(value, size/2, size/2);
  return new THREE.CanvasTexture(canvas);
}

// ---------- Сцена ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5a4530);
scene.fog = new THREE.Fog(0x5a4530, 12, 28);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5, 7, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xfff0d0, 3.5);
key.position.set(5, 10, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5;  key.shadow.camera.bottom = -5;
scene.add(key);
scene.add(new THREE.AmbientLight(0xffe0b0, 1.8));
const rim = new THREE.PointLight(0xffaa44, 3, 15);
rim.position.set(-4, 3, -4);
scene.add(rim);
scene.add(new THREE.PointLight(0xffeedd, 2.5, 15).translateX(4).translateY(2).translateZ(4));
scene.add(new THREE.PointLight(0xffffff, 1.5, 15).translateY(8));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 5; controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI / 2.2;
controls.target.set(0, 0, 0);
// На мобильных отключаем вращение камеры, чтобы не конфликтовало со свайпами
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouchDevice) {
  controls.enableRotate = false;
  controls.enablePan = false;
}

// ---------- Основание ----------
const boardGroup = new THREE.Group();
scene.add(boardGroup);

const boardSize = SIZE * STEP;
const base = new THREE.Mesh(
  new THREE.BoxGeometry(boardSize + 0.3, 0.25, boardSize + 0.3),
  new THREE.MeshStandardMaterial({ color: 0xb8935a, metalness: 0.85, roughness: 0.35 })
);
base.position.y = -0.25;
base.receiveShadow = true;
boardGroup.add(base);

const frameMat = new THREE.MeshStandardMaterial({ color: 0xe8c070, metalness: 0.95, roughness: 0.2 });
const ft = 0.15, fh = 0.35, fs = boardSize + 0.3;
[
  { s: [fs + ft*2, fh, ft], p: [0, -0.1, fs/2 + ft/2] },
  { s: [fs + ft*2, fh, ft], p: [0, -0.1, -fs/2 - ft/2] },
  { s: [ft, fh, fs], p: [fs/2 + ft/2, -0.1, 0] },
  { s: [ft, fh, fs], p: [-fs/2 - ft/2, -0.1, 0] },
].forEach(f => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...f.s), frameMat);
  m.position.set(...f.p);
  m.castShadow = true; m.receiveShadow = true;
  boardGroup.add(m);
});

for (let r = 0; r < SIZE; r++) {
  for (let c = 0; c < SIZE; c++) {
    const slot = new THREE.Mesh(
      new THREE.BoxGeometry(TILE, 0.08, TILE),
      new THREE.MeshStandardMaterial({ color: 0x6a4a28, metalness: 0.7, roughness: 0.5 })
    );
    slot.position.set((c - 1.5) * STEP, -0.12, (r - 1.5) * STEP);
    slot.receiveShadow = true;
    boardGroup.add(slot);
  }
}

// ---------- Плитки ----------
const tileGeo = new THREE.BoxGeometry(TILE, 0.35, TILE);
class Tile {
  constructor(value, r, c) {
    this.value = value; this.r = r; this.c = c;
    this.mesh = this.createMesh(value);
    this.mesh.position.set(...this.worldPos(r, c));
    this.mesh.scale.set(0.01, 0.01, 0.01);
    boardGroup.add(this.mesh);
    this.animateScale(1.0, 250);
    sound.playSpawn();
  }
  worldPos(r, c) { return [(c - 1.5) * STEP, 0.05, (r - 1.5) * STEP]; }
  createMesh(value) {
    const mesh = new THREE.Mesh(tileGeo, new THREE.MeshStandardMaterial({
      map: makeGoldTexture(value),
      bumpMap: makeBumpTexture(value),
      bumpScale: 0.12,
      metalness: 0.95, roughness: 0.25,
      envMapIntensity: 1.2,
    }));
    mesh.castShadow = true; mesh.receiveShadow = true;
    return mesh;
  }
  moveTo(r, c, duration = 180) {
    this.r = r; this.c = c;
    const [x, y, z] = this.worldPos(r, c);
    this.animatePosition(x, y, z, duration);
  }
  mergeWith(other) {
    other.animateScale(0.01, 150, () => boardGroup.remove(other.mesh));
    this.value *= 2;
    const newMesh = this.createMesh(this.value);
    newMesh.position.copy(this.mesh.position);
    newMesh.scale.copy(this.mesh.scale);
    boardGroup.remove(this.mesh);
    this.mesh = newMesh;
    boardGroup.add(this.mesh);
    this.animateScale(1.15, 120, () => this.animateScale(1.0, 150));
    sound.playMerge(this.value);
  }
  animateScale(target, duration, done) {
    const start = this.mesh.scale.x;
    const t0 = performance.now();
    const step = () => {
      const t = Math.min(1, (performance.now() - t0) / duration);
      const e = 1 - Math.pow(1 - t, 3);
      const s = start + (target - start) * e;
      this.mesh.scale.set(s, s, s);
      if (t < 1) requestAnimationFrame(step);
      else if (done) done();
    };
    step();
  }
  animatePosition(x, y, z, duration) {
    const sx = this.mesh.position.x, sy = this.mesh.position.y, sz = this.mesh.position.z;
    const t0 = performance.now();
    const step = () => {
      const t = Math.min(1, (performance.now() - t0) / duration);
      const e = 1 - Math.pow(1 - t, 3);
      this.mesh.position.set(sx + (x - sx) * e, sy + (y - sy) * e, sz + (z - sz) * e);
      if (t < 1) requestAnimationFrame(step);
    };
    step();
  }
  destroy() { boardGroup.remove(this.mesh); }
}

// ---------- Логика 2048 ----------
class Game {
  constructor() {
    this.grid = Array.from({length: SIZE}, () => Array(SIZE).fill(null));
    this.score = 0;
    this.best = parseInt(localStorage.getItem('best2048') || '0');
    this.busy = false;
    this.updateScore();
    this.restart();
  }
  restart() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (this.grid[r][c]) { this.grid[r][c].destroy(); this.grid[r][c] = null; }
    this.score = 0;
    this.updateScore();
    document.getElementById('overlay').classList.remove('show');
    this.spawn(); this.spawn();
  }
  emptyCells() {
    const list = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!this.grid[r][c]) list.push([r, c]);
    return list;
  }
  spawn() {
    const empty = this.emptyCells();
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    this.grid[r][c] = new Tile(Math.random() < 0.9 ? 2 : 4, r, c);
  }
  updateScore() {
    document.getElementById('score').textContent = `Счёт: ${this.score}`;
    document.getElementById('best').textContent = `Рекорд: ${this.best}`;
  }
  move(dir) {
    if (this.busy) return;
    sound.init();
    this.busy = true;
    let moved = false;
    const traversals = this.getTraversals(dir);
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (this.grid[r][c]) this.grid[r][c].merged = false;

    for (const r of traversals.rows) {
      for (const c of traversals.cols) {
        const tile = this.grid[r][c];
        if (!tile) continue;
        const { farthest, next } = this.findFarthest(r, c, dir);
        if (next && this.grid[next.r][next.c] &&
            this.grid[next.r][next.c].value === tile.value &&
            !this.grid[next.r][next.c].merged) {
          const target = this.grid[next.r][next.c];
          tile.moveTo(next.r, next.c);
          target.mergeWith(tile);
          this.grid[r][c] = null;
          target.merged = true;
          this.score += target.value;
          moved = true;
        } else if (farthest.r !== r || farthest.c !== c) {
          this.grid[farthest.r][farthest.c] = tile;
          this.grid[r][c] = null;
          tile.moveTo(farthest.r, farthest.c);
          moved = true;
        }
      }
    }
    if (moved) {
      sound.playMove();
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('best2048', this.best);
      }
      this.updateScore();
    }
    setTimeout(() => {
      if (moved) this.spawn();
      this.busy = false;
      this.checkEnd();
    }, 200);
  }
  getTraversals(dir) {
    const rows = [...Array(SIZE).keys()];
    const cols = [...Array(SIZE).keys()];
    if (dir === 'down')  rows.reverse();
    if (dir === 'right') cols.reverse();
    return { rows, cols };
  }
  vector(dir) { return { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] }[dir]; }
  findFarthest(r, c, dir) {
    const [dr, dc] = this.vector(dir);
    let prev;
    do { prev = { r, c }; r += dr; c += dc; }
    while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && !this.grid[r][c]);
    const next = (r >= 0 && r < SIZE && c >= 0 && c < SIZE) ? { r, c } : null;
    return { farthest: prev, next };
  }
  checkEnd() {
    if (this.emptyCells().length) return;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = this.grid[r][c].value;
        if (r < SIZE-1 && this.grid[r+1][c].value === v) return;
        if (c < SIZE-1 && this.grid[r][c+1].value === v) return;
      }
    }
    document.getElementById('endText').textContent = 'GAME OVER';
    document.getElementById('finalScore').textContent = `Ваш счёт: ${this.score}`;
    document.getElementById('overlay').classList.add('show');
  }
}

const game = new Game();
window.game = game;

// ---------- Управление ----------
// Клавиатура
addEventListener('keydown', e => {
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  if (map[e.key]) { e.preventDefault(); game.move(map[e.key]); }
});

// ---------- СВАЙПЫ (улучшенная версия) ----------
const swipeIndicator = document.getElementById('swipeIndicator');
const swipeArrow = document.getElementById('swipeArrow');
let touchStart = null;
let touchStartTime = 0;
const SWIPE_THRESHOLD = 30; // минимальная длина свайпа в пикселях
const SWIPE_TIME_LIMIT = 500; // максимум мс на свайп

// Стрелки для индикатора (SVG paths)
const arrowPaths = {
  up:    'M 50 85 L 50 15 M 25 40 L 50 15 L 75 40',
  down:  'M 50 15 L 50 85 M 25 60 L 50 85 L 75 60',
  left:  'M 85 50 L 15 50 M 40 25 L 15 50 L 40 75',
  right: 'M 15 50 L 85 50 M 60 25 L 85 50 L 60 75',
};

function showSwipeIndicator(dir) {
  swipeArrow.setAttribute('d', arrowPaths[dir]);
  swipeIndicator.classList.add('show');
  clearTimeout(swipeIndicator._hideTimer);
  swipeIndicator._hideTimer = setTimeout(() => {
    swipeIndicator.classList.remove('show');
  }, 200);
}

function detectSwipeDirection(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
  return dy > 0 ? 'down' : 'up';
}

// Обработчик начала касания
addEventListener('touchstart', e => {
  // Игнорируем касания на UI-элементах
  if (e.target.closest('#ui') || e.target.closest('#overlay')) return;
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  touchStartTime = performance.now();
}, { passive: true });

// Обработчик движения — предотвращаем скролл страницы
addEventListener('touchmove', e => {
  if (touchStart) e.preventDefault();
}, { passive: false });

// Обработчик окончания касания
addEventListener('touchend', e => {
  if (!touchStart) return;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - touchStart.x;
  const dy = touch.clientY - touchStart.y;
  const dt = performance.now() - touchStartTime;
  const dist = Math.max(Math.abs(dx), Math.abs(dy));

  // Сбрасываем состояние
  const wasTouch = touchStart;
  touchStart = null;

  // Проверяем, что это был осознанный свайп
  if (dist < SWIPE_THRESHOLD || dt > SWIPE_TIME_LIMIT) return;

  const dir = detectSwipeDirection(dx, dy);
  showSwipeIndicator(dir);
  game.move(dir);
});

// Обработчик отмены касания
addEventListener('touchcancel', () => { touchStart = null; });

// Предотвращаем зум двойным тапом и контекстное меню
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('contextmenu', e => {
  if (e.target.closest('canvas')) e.preventDefault();
});

// ---------- Resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Анимация ----------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const t = performance.now() * 0.0003;
  rim.position.x = Math.cos(t) * 4;
  rim.position.z = Math.sin(t) * 4;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
