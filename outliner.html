<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Markdown Аутлайнер (Pro + LaTeX)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <!-- KaTeX для математики -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --sidebar-bg: #252526;
            --border-color: #333;
            --text-main: #d4d4d4;
            --accent: #007acc;
            --hover: #2a2d2e;
            --active: #37373d;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; user-select: none; }
        .sidebar-header { padding: 12px 15px; font-weight: bold; border-bottom: 1px solid var(--border-color); background: #333; font-size: 14px; }
        .tree-container { flex-grow: 1; overflow-y: auto; padding: 10px 0; }
        
        ul.tree { list-style: none; padding-left: 0; margin: 0; }
        ul.tree ul { list-style: none; padding-left: 18px; margin: 0; display: block; border-left: 1px dashed #444; }
        ul.tree ul.collapsed { display: none; }

        .node-row { 
            display: flex; align-items: center; padding: 5px 10px; cursor: pointer; 
            border-left: 3px solid transparent; transition: 0.1s; font-size: 14px;
        }
        .node-row:hover { background: var(--hover); }
        .node-row.active { background: var(--active); border-left-color: var(--accent); }
        
        .toggle-icon { width: 16px; text-align: center; margin-right: 5px; color: #888; font-size: 10px; cursor: pointer; flex-shrink: 0; }
        .toggle-icon:hover { color: #fff; }
        
        .node-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 5px; }
        
        .edit-icon { 
            cursor: pointer; opacity: 0; transition: opacity 0.2s; padding: 2px 5px; font-size: 12px; color: #aaa; 
        }
        .node-row:hover .edit-icon, .node-row.active .edit-icon { opacity: 1; }
        .edit-icon:hover { color: #fff; }

        .node-title-input { 
            background: #2d2d2d; border: 1px solid var(--accent); color: inherit; font-family: inherit; font-size: inherit;
            width: 100%; padding: 2px 5px; border-radius: 4px; outline: none; display: none;
        }

        .tree-controls { padding: 10px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #888; }
        .shortcut-hint { background: #2d2d2d; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; line-height: 1.4; }
        .btn-sm { flex: 1; padding: 6px; background: #3c3c3c; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-sm:hover { background: #4c4c4c; }

        .editor-area { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        .toolbar { padding: 10px; background: #2d2d2d; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        
        textarea { 
            flex-grow: 1; background: var(--bg-dark); color: var(--text-main); border: none; 
            resize: none; padding: 20px; font-family: 'Consolas', monospace; font-size: 14px; outline: none; line-height: 1.6; tab-size: 4;
        }

        #preview { 
            flex-grow: 1; padding: 30px 50px; overflow: auto; display: none; 
            color: #c9d1d9; line-height: 1.6; font-size: 16px;
        }
        #preview h1, #preview h2, #preview h3 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 30px; }
        #preview h1 { font-size: 2em; }
        #preview h2 { font-size: 1.5em; }
        #preview a { color: var(--accent); text-decoration: none; }
        #preview blockquote { border-left: 4px solid var(--accent); margin: 0; padding-left: 15px; color: #8b949e; }
        #preview code { background: #2d2d2d; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        #preview pre { background: #161b22 !important; border: 1px solid #30363d; border-radius: 6px; padding: 15px; overflow-x: auto; }
        #preview pre code { background: transparent; padding: 0; color: inherit; }
        
        /* Стили для KaTeX */
        #preview .katex-display { margin: 1.5em 0; overflow-x: auto; overflow-y: hidden; }
        #preview .katex { font-size: 1.1em; }

        .status-bar { 
            padding: 5px 15px; 
            background: var(--accent); 
            color: white; 
            font-size: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">📂 Структура проекта</div>
    <div class="tree-container" id="treeRoot"></div>
    <div class="tree-controls">
        <div class="shortcut-hint">
            ↵ Новая ветка &nbsp;|&nbsp; ⇧↵ Вложить<br>
            ✏️ Переименовать &nbsp;|&nbsp; Del Удалить<br>
            <span style="color:#aaa;">LaTeX: <code>$x^2$</code> или <code>$$\int f dx$$</code></span>
        </div>
        <div style="display:flex; gap:5px;">
            <button class="btn-sm" onclick="addChild()">➕ Вложить</button>
            <button class="btn-sm" onclick="addSibling()">➕ Рядом</button>
            <button class="btn-sm" onclick="deleteNode()" style="background:#ce3939">🗑 Удалить</button>
        </div>
    </div>
</div>

<div class="editor-area">
    <div class="toolbar">
        <span style="font-weight:bold; color:#fff;">Markdown + LaTeX Editor</span>
        <button class="btn-sm" style="width:auto; padding: 6px 15px;" onclick="toggleMode()">👁 Переключить вид</button>
    </div>
    
    <textarea id="codeEditor" placeholder="# Заголовок&#10;&#10;Текст с формулой: $E = mc^2$&#10;&#10;Блочная формула:&#10;$$\int_0^\infty e^{-x^2} dx = \frac{\sqrt{\pi}}{2}$$&#10;&#10;```cpp&#10;int x = 10;&#10;```" oninput="onContentChange()"></textarea>
    <div id="preview"></div>

    <div class="status-bar">
        <span id="status">Готово</span>
        <span id="storageInfo"></span>
    </div>
</div>

<!-- Библиотеки -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<script>
    // === СОСТОЯНИЕ ===
    let data = JSON.parse(localStorage.getItem('mdTreeData')) || [
        { id: 1, title: '📌 Пример LaTeX', content: '# Математика в Markdown\n\nInline формула: $E = mc^2$\n\nБлочная формула:\n$$\\int_0^\\infty e^{-x^2} dx = \\frac{\\sqrt{\\pi}}{2}$$\n\nМатрица:\n$$\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$$\n\n## Код C++\n\n```cpp\n#include <iostream>\nint main() {\n    std::cout << "Hello!";\n    return 0;\n}\n```', collapsed: false,
            children: [
                { id: 2, title: '📝 Заметки', content: '- Изучить KaTeX\n- Протестировать формулы', collapsed: false, children: [] }
            ] 
        }
    ];

    let activeId = 1;
    let editingId = null;
    let isPreviewMode = false;
    let saveTimeout = null;

    // === MARKDOWN + LATEX РЕНДЕРЕР ===
    function renderMarkdownWithMath(text) {
        const mathBlocks = [];
        let counter = 0;
        
        // 1. Разбиваем текст на части: код (```...```) и обычный текст
        const parts = [];
        const codeRegex = /```[\s\S]*?```/g;
        let lastIndex = 0;
        let match;
        
        while ((match = codeRegex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                parts.push({ type: 'text', content: text.slice(lastIndex, match.index) });
            }
            parts.push({ type: 'code', content: match[0] });
            lastIndex = match.index + match[0].length;
        }
        if (lastIndex < text.length) {
            parts.push({ type: 'text', content: text.slice(lastIndex) });
        }
        
        // 2. В текстовых частях заменяем математику на placeholder'ы
        const processed = parts.map(part => {
            if (part.type === 'code') return part.content;
            
            // Block math $$...$$
            let result = part.content.replace(/\$\$([\s\S]+?)\$\$/g, (m, math) => {
                const id = `@@MATH_BLOCK_${counter++}@@`;
                mathBlocks.push({ id, math: math.trim(), display: true });
                return id;
            });
            
            // Inline math $...$
            result = result.replace(/\$([^\$\n]+?)\$/g, (m, math) => {
                const id = `@@MATH_INLINE_${counter++}@@`;
                mathBlocks.push({ id, math: math.trim(), display: false });
                return id;
            });
            
            return result;
        }).join('');
        
        // 3. Прогоняем через marked
        let html = marked.parse(processed);
        
        // 4. Заменяем placeholder'ы на отрендеренный KaTeX
        mathBlocks.forEach(({ id, math, display }) => {
            try {
                const rendered = katex.renderToString(math, { 
                    displayMode: display,
                    throwOnError: false 
                });
                html = html.replace(id, rendered);
            } catch (e) {
                html = html.replace(id, `<span style="color:red">[Math Error: ${e.message}]</span>`);
            }
        });
        
        return html;
    }

    // === УТИЛИТЫ ДЕРЕВА ===
    function findNode(id, nodes = data) {
        for (let node of nodes) {
            if (node.id === id) return node;
            if (node.children.length > 0) {
                const found = findNode(id, node.children);
                if (found) return found;
            }
        }
        return null;
    }

    function findParent(id, nodes = data, parent = null) {
        for (let node of nodes) {
            if (node.id === id) return parent;
            if (node.children.length > 0) {
                const found = findParent(id, node.children, node);
                if (found) return found;
            }
        }
        return null;
    }

    // === ОТРИСОВКА ===
    function renderTree() {
        const root = document.getElementById('treeRoot');
        root.innerHTML = '';
        const ul = document.createElement('ul');
        ul.className = 'tree';
        data.forEach(node => ul.appendChild(createNodeElement(node)));
        root.appendChild(ul);
        updateActiveNodeInTree();
    }

    function createNodeElement(node) {
        const li = document.createElement('li');
        const row = document.createElement('div');
        row.className = `node-row ${node.id === activeId ? 'active' : ''}`;
        row.dataset.id = node.id;

        const toggle = document.createElement('span');
        toggle.className = 'toggle-icon';
        if (node.children.length > 0) {
            toggle.textContent = node.collapsed ? '▶' : '▼';
            toggle.onclick = (e) => { e.stopPropagation(); node.collapsed = !node.collapsed; saveToStorage(); renderTree(); };
        } else { toggle.textContent = '•'; toggle.style.opacity = '0.3'; }
        row.appendChild(toggle);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'node-title';
        titleSpan.textContent = node.title;
        row.appendChild(titleSpan);

        const editIcon = document.createElement('span');
        editIcon.className = 'edit-icon';
        editIcon.textContent = '✏️';
        editIcon.onclick = (e) => { e.stopPropagation(); startEditing(node.id); };
        row.appendChild(editIcon);

        const input = document.createElement('input');
        input.className = 'node-title-input';
        input.value = node.title;
        input.onblur = () => finishEditing(node.id, true);
        input.onkeydown = (e) => {
            if (e.key === 'Enter') { 
                e.preventDefault(); 
                e.stopPropagation();
                finishEditing(node.id, true); 
            }
            if (e.key === 'Escape') { 
                e.preventDefault(); 
                e.stopPropagation();
                finishEditing(node.id, false); 
            }
        };
        row.appendChild(input);

        row.onclick = (e) => {
            if (e.target === editIcon || e.target === input) return;
            selectNode(node.id);
        };

        li.appendChild(row);

        if (node.children.length > 0) {
            const childUl = document.createElement('ul');
            if (node.collapsed) childUl.className = 'collapsed';
            node.children.forEach(child => childUl.appendChild(createNodeElement(child)));
            li.appendChild(childUl);
        }
        return li;
    }

    function updateActiveNodeInTree() {
        document.querySelectorAll('.node-row.active').forEach(el => el.classList.remove('active'));
        const activeRow = document.querySelector(`.node-row[data-id="${activeId}"]`);
        if (activeRow) activeRow.classList.add('active');
    }

    // === РЕДАКТИРОВАНИЕ ===
    function startEditing(id) {
        if (editingId) finishEditing(editingId, true);
        editingId = id;
        const row = document.querySelector(`.node-row[data-id="${id}"]`);
        if (!row) return;
        
        row.querySelector('.node-title').style.display = 'none';
        row.querySelector('.edit-icon').style.display = 'none';
        const input = row.querySelector('.node-title-input');
        input.style.display = 'block';
        input.focus();
        input.select();
    }

    function finishEditing(id, save) {
        if (editingId !== id) return;
        const row = document.querySelector(`.node-row[data-id="${id}"]`);
        if (!row) return;
        
        const node = findNode(id);
        const input = row.querySelector('.node-title-input');
        const titleSpan = row.querySelector('.node-title');
        const editIcon = row.querySelector('.edit-icon');

        if (save) {
            const newName = input.value.trim() || 'Без названия';
            node.title = newName;
            titleSpan.textContent = newName;
            debounceSave();
        } else {
            input.value = node.title;
        }

        input.style.display = 'none';
        titleSpan.style.display = 'block';
        editIcon.style.display = 'inline-block';
        editingId = null;
    }

    // === ВЫБОР ===
    function selectNode(id) {
        if (editingId) finishEditing(editingId, true);
        if (id === activeId) return;
        
        activeId = id;
        const node = findNode(id);
        if (!node) return;
        
        document.getElementById('codeEditor').value = node.content;
        if(isPreviewMode) updatePreview();
        updateActiveNodeInTree();
    }

    function onContentChange() {
        const node = findNode(activeId);
        if (node) {
            node.content = document.getElementById('codeEditor').value;
            debounceSave();
            if(isPreviewMode) updatePreview();
        }
    }

    // === СТРУКТУРНЫЕ ДЕЙСТВИЯ ===
    function addChild() {
        const parent = findNode(activeId);
        if (!parent) return;
        const newNode = { id: Date.now(), title: 'Новый пункт', content: '', children: [], collapsed: false };
        parent.children.push(newNode);
        parent.collapsed = false;
        saveToStorage(); renderTree(); selectNode(newNode.id);
        startEditing(newNode.id);
    }

    function addSibling() {
        const parent = findParent(activeId);
        const list = parent ? parent.children : data;
        const index = list.findIndex(n => n.id === activeId);
        if (index === -1) return;
        
        const newNode = { id: Date.now(), title: 'Новый пункт', content: '', children: [], collapsed: false };
        list.splice(index + 1, 0, newNode);
        saveToStorage(); renderTree(); selectNode(newNode.id);
        startEditing(newNode.id);
    }

    function deleteNode() {
        if (data.length === 1 && data[0].children.length === 0) {
            alert("Нельзя удалить единственный корень!"); return;
        }
        const parent = findParent(activeId);
        const list = parent ? parent.children : data;
        const index = list.findIndex(n => n.id === activeId);
        if (confirm(`Удалить "${list[index].title}" и всех его детей?`)) {
            list.splice(index, 1);
            const nextId = list[index] ? list[index].id : (parent ? parent.id : data[0].id);
            saveToStorage(); renderTree(); selectNode(nextId);
        }
    }

    function saveToStorage() {
        try {
            localStorage.setItem('mdTreeData', JSON.stringify(data));
            document.getElementById('status').textContent = '💾 Сохранено';
            updateStorageInfo();
        } catch (e) {
            document.getElementById('status').textContent = '⚠️ Хранилище переполнено!';
        }
    }

    function debounceSave() {
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveToStorage, 400);
    }

    function updateStorageInfo() {
        const dataStr = localStorage.getItem('mdTreeData') || '';
        const usedBytes = new Blob([dataStr]).size;
        const limitBytes = 5 * 1024 * 1024;
        const percent = ((usedBytes / limitBytes) * 100).toFixed(2);
        
        let color = '#4caf50';
        if (percent > 70) color = '#ff9800';
        if (percent > 90) color = '#f44336';
        
        const info = document.getElementById('storageInfo');
        if (info) {
            info.innerHTML = `💾 ${(usedBytes/1024).toFixed(1)} КБ / 5 МБ (${percent}%)`;
            info.style.color = color;
        }
    }

    // === ГОРЯЧИЕ КЛАВИШИ (ИСПРАВЛЕНО!) ===
    document.addEventListener('keydown', (e) => {
        // ✅ ИСПРАВЛЕНИЕ: проверяем и INPUT, и TEXTAREA
        const activeTag = document.activeElement.tagName;
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
        if (editingId) return;
        if (!activeId) return;

        if (e.key === 'Enter') {
            e.preventDefault();
            if (e.shiftKey) addChild();
            else addSibling();
        }
        if (e.key === 'Delete' || e.key === 'Backspace') {
            e.preventDefault();
            deleteNode();
        }
    });

    // === PREVIEW ===
    function toggleMode() {
        isPreviewMode = !isPreviewMode;
        const editor = document.getElementById('codeEditor');
        const preview = document.getElementById('preview');
        if (isPreviewMode) {
            editor.style.display = 'none'; preview.style.display = 'block'; updatePreview();
        } else {
            editor.style.display = 'block'; preview.style.display = 'none';
        }
    }

    function updatePreview() {
        const node = findNode(activeId);
        if (!node) return;
        
        // ✅ ИСПОЛЬЗУЕМ НОВЫЙ РЕНДЕРЕР С LATEX
        document.getElementById('preview').innerHTML = renderMarkdownWithMath(node.content);
        
        // Подсветка кода
        document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    }

    // Инициализация
    renderTree();
    selectNode(activeId);
    updateStorageInfo();
</script>
</body>
</html>
